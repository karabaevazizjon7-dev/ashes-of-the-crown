name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Combine and extract Alpha 27 project
        run: |
          cat ashes_alpha27_jvm17_part01.bin \
              ashes_alpha27_jvm17_part02.bin \
              ashes_alpha27_jvm17_part03.bin \
              > ashes_alpha27.zip

          unzip -t ashes_alpha27.zip
          unzip -q ashes_alpha27.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ashes_v2
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashes-of-the-crown-alpha27-apk
          path: ashes_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
