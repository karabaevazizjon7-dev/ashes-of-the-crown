name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Combine Alpha 25 archive
        run: |
          cat ashes_alpha25_part01.bin \
              ashes_alpha25_part02.bin \
              ashes_alpha25_part03.bin \
              > ashes_of_the_crown_android_v5.0.1.zip

      - name: Check and extract project
        run: |
          unzip -t ashes_of_the_crown_android_v5.0.1.zip
          mkdir -p project
          unzip -q ashes_of_the_crown_android_v5.0.1.zip -d project

      - name: Check project structure
        run: |
          test -f project/ashes_v2/app/build.gradle.kts
          test -f project/ashes_v2/settings.gradle.kts
          echo "Project structure OK"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Java and Kotlin versions
        run: |
          cat >> project/ashes_v2/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project/ashes_v2
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashes-of-the-crown-apk
          path: project/ashes_v2/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
