name: Manual Android debug APK

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Type YES to authorize a debug APK build (compile + lint run first)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-debug-apk:
    if: github.ref == 'refs/heads/main' && inputs.confirm_build == 'YES'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Kotlin compilation and Android lint before packaging
        run: gradle --no-daemon --stacktrace --warning-mode all :app:compileDebugKotlin :app:lintDebug

      - name: Build debug APK after explicit authorization
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ashes-of-the-crown-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
